<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hexa EXPRESSION v0.3</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;--bg:#10141d;--panel:#171e2a;--line:#303b4d;--fg:#eaf0fb;--muted:#9cacc2;--accent:#5de0cf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);overflow:hidden}
button,input{font:inherit}
header{height:60px;display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid var(--line);background:#121824}
header strong{font-size:17px;color:var(--accent);margin-right:10px}
header small{color:var(--muted)}
button{background:#242d3d;color:var(--fg);border:1px solid #3b485e;border-radius:7px;padding:8px 10px;cursor:pointer}
button:hover{background:#334158}
button:disabled{opacity:.4;cursor:default}
main{height:calc(100vh - 92px);display:grid;grid-template-columns:minmax(420px,1fr) 340px}
#view{position:relative;min-width:0;overflow:hidden;background:radial-gradient(circle at 50% 42%,#29384c 0,#151c28 58%,#0e131c 100%)}
#canvas{display:block;width:100%;height:100%}
#hint{position:absolute;left:16px;bottom:16px;padding:9px 12px;border-radius:8px;background:#0c111bcc;color:#b9c6d8;font-size:12px;pointer-events:none}
aside{overflow-y:auto;padding:16px 18px 24px;border-left:1px solid var(--line);background:var(--panel)}
h2{font-size:15px;margin:0 0 12px;color:#cad6e6}
.section{border-top:1px solid var(--line);margin-top:16px;padding-top:15px}
.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.preset-grid button{padding:10px 5px}
.preset-grid button.active{background:#176f70;border-color:var(--accent)}
.row{display:grid;grid-template-columns:88px 1fr 42px;gap:8px;align-items:center;margin:10px 0}
.row label{font-size:12px;color:#d7e0ed}
.row input[type=range]{width:100%;accent-color:var(--accent)}
.value{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px}
.note{display:block;color:var(--muted);font-size:12px;line-height:1.5;margin-top:10px}
#load{display:none}
#status{height:32px;border-top:1px solid var(--line);padding:7px 16px;color:#aebbd0;font-size:12px;background:#121824}
@media(max-width:760px){
 body{overflow:auto}
 header{height:auto;min-height:60px;flex-wrap:wrap}
 main{height:auto;grid-template-columns:1fr}
 #view{height:58vh;min-height:420px}
 aside{border-left:0;border-top:1px solid var(--line)}
 #status{position:sticky;bottom:0}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<header>
<strong>⬡ HEXA EXPRESSION <small>v0.3</small></strong>
<button id="reset">표정 초기화</button>
<button id="undo" title="Ctrl+Z">↶ 실행 취소</button>
<button id="redo" title="Ctrl+Y">↷ 다시 실행</button>
<button id="save">JSON 저장</button>
<button id="loadbtn">JSON 불러오기</button>
<input id="load" type="file" accept=".json,application/json">
<button id="png">PNG 출력</button>
</header>
<main>
<section id="view">
<canvas id="canvas"></canvas>
<div id="hint">드래그: 얼굴 회전 · 휠: 확대/축소 · 오른쪽 드래그: 이동</div>
</section>
<aside>
<h2>😊 표정 프리셋</h2>
<div class="preset-grid" id="presetButtons">
<button data-preset="neutral">😐 무표정</button>
<button data-preset="happy">😊 기쁨</button>
<button data-preset="sad">😢 슬픔</button>
<button data-preset="angry">😠 화남</button>
<button data-preset="surprised">😮 놀람</button>
<button data-preset="wink">😉 윙크</button>
</div>
<div class="section">
<h2>눈과 눈썹</h2>
<div id="eyeControls"></div>
</div>
<div class="section">
<h2>입</h2>
<div id="mouthControls"></div>
</div>
<div class="section">
<h2>코·볼·턱</h2>
<div id="lowerControls"></div>
</div>
<div class="section">
<h2>보기</h2>
<div class="action-row">
<button id="frontView">정면 보기</button>
<button id="threeView">3/4 보기</button>
</div>
<small class="note">표정 JSON에는 얼굴 파라미터만 저장됩니다. 몸이나 관절 데이터는 포함하지 않습니다.</small>
</div>
</aside>
</main>
<div id="status">준비 중…</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const $=id=>document.getElementById(id);
const status=message=>$('status').textContent=message;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(32,1,.05,100);
camera.position.set(0,0,4.4);

const renderer=new THREE.WebGLRenderer({canvas:$('canvas'),antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;

const orbit=new OrbitControls(camera,renderer.domElement);
orbit.target.set(0,.02,0);
orbit.enableDamping=true;
orbit.minDistance=2.7;
orbit.maxDistance=7;
orbit.update();

scene.add(new THREE.HemisphereLight(0xeaf5ff,0x263146,2.4));
const keyLight=new THREE.DirectionalLight(0xffffff,3.4);
keyLight.position.set(3,4,5);
keyLight.castShadow=true;
scene.add(keyLight);
const fillLight=new THREE.DirectionalLight(0x74d9ff,1.1);
fillLight.position.set(-4,1,3);
scene.add(fillLight);
const rimLight=new THREE.DirectionalLight(0xff8fcf,1.1);
rimLight.position.set(2,2,-4);
scene.add(rimLight);

const skinMat=new THREE.MeshStandardMaterial({color:0xe4a682,roughness:.72,metalness:0});
const skinDarkMat=new THREE.MeshStandardMaterial({color:0xc98267,roughness:.76});
const whiteMat=new THREE.MeshStandardMaterial({color:0xf7fbff,roughness:.4});
const darkMat=new THREE.MeshStandardMaterial({color:0x18202b,roughness:.58});
const irisMat=new THREE.MeshStandardMaterial({color:0x4fc3bf,roughness:.35,metalness:.05});
const mouthMat=new THREE.MeshStandardMaterial({color:0x5a1726,roughness:.7});
const lipMat=new THREE.MeshStandardMaterial({color:0xb94361,roughness:.58});
const tongueMat=new THREE.MeshStandardMaterial({color:0xe96f87,roughness:.68});
const cheekMat=new THREE.MeshStandardMaterial({color:0xff7f91,roughness:.8,transparent:true,opacity:0});

const sphere=new THREE.SphereGeometry(1,48,32);
const box=new THREE.BoxGeometry(1,1,1);
function mesh(geometry,material,parent,position,scale){
 const value=new THREE.Mesh(geometry,material);
 value.position.set(...position);
 value.scale.set(...scale);
 value.castShadow=true;
 value.receiveShadow=true;
 parent.add(value);
 return value;
}

const head=new THREE.Group();
scene.add(head);
mesh(sphere,skinMat,head,[0,0,0],[1.08,1.27,1]);
mesh(sphere,skinDarkMat,head,[-1.04,.02,-.02],[.2,.36,.16]);
mesh(sphere,skinDarkMat,head,[1.04,.02,-.02],[.2,.36,.16]);
mesh(sphere,skinMat,head,[0,-1.18,-.05],[.45,.34,.52]);

const parts={};
const lidSeed=new THREE.LineCurve3(new THREE.Vector3(-.3,.28,1.07),new THREE.Vector3(.3,.28,1.07));
for(const [side,x] of [['L',-.42],['R',.42]]){
 parts['eye'+side]=mesh(sphere,whiteMat,head,[x,.28,.9],[.32,.18,.085]);
 parts['iris'+side]=mesh(sphere,irisMat,head,[x,.28,.985],[.115,.115,.035]);
 parts['pupil'+side]=mesh(sphere,darkMat,head,[x,.28,1.018],[.052,.052,.018]);
 parts['upperLid'+side]=mesh(new THREE.TubeGeometry(lidSeed,20,.026,8,false),skinDarkMat,head,[0,0,0],[1,1,1]);
 parts['lowerLid'+side]=mesh(new THREE.TubeGeometry(lidSeed,20,.022,8,false),skinDarkMat,head,[0,0,0],[1,1,1]);
 parts['brow'+side]=mesh(box,darkMat,head,[x,.63,.91],[.57,.09,.075]);
 parts['cheek'+side]=mesh(sphere,cheekMat.clone(),head,[x*.95,-.05,.99],[.24,.11,.035]);
 parts['puff'+side]=mesh(sphere,skinMat,head,[x<0?-.72:.72,-.08,.68],[.01,.01,.01]);
}
parts.noseBridge=mesh(sphere,skinDarkMat,head,[0,.1,.9],[.13,.25,.12]);
parts.noseTip=mesh(sphere,skinMat,head,[0,-.035,1.08],[.2,.15,.17]);
parts.nostrilL=mesh(sphere,darkMat,head,[-.078,-.105,1.16],[.045,.026,.018]);
parts.nostrilR=mesh(sphere,darkMat,head,[.078,-.105,1.16],[.045,.026,.018]);
parts.noseCreaseL=mesh(box,darkMat,head,[-.19,.0,1.07],[.18,.025,.02]);
parts.noseCreaseR=mesh(box,darkMat,head,[.19,.0,1.07],[.18,.025,.02]);
parts.noseCreaseL.rotation.z=-.45;parts.noseCreaseR.rotation.z=.45;
const jaw=new THREE.Group();head.add(jaw);
parts.jaw=mesh(sphere,skinMat,jaw,[0,-.66,.08],[.76,.48,.82]);
parts.mouthOpen=mesh(sphere,mouthMat,jaw,[0,-.43,.96],[.4,.04,.055]);
parts.tongue=mesh(sphere,tongueMat,jaw,[0,-.48,1.015],[.27,.03,.025]);
const lipSeed=new THREE.LineCurve3(new THREE.Vector3(-.4,-.42,1.04),new THREE.Vector3(.4,-.42,1.04));
parts.upperLip=mesh(new THREE.TubeGeometry(lipSeed,24,.045,10,false),lipMat,jaw,[0,0,0],[1,1,1]);
parts.lowerLip=mesh(new THREE.TubeGeometry(lipSeed,24,.052,10,false),lipMat,jaw,[0,0,0],[1,1,1]);

const defaultFace={leftEye:100,rightEye:100,browRaise:0,browTilt:0,gazeX:0,gazeY:0,smile:0,mouthOpen:0,mouthWidth:0,lipPucker:0,upperLip:45,lowerLip:55,nostrilFlare:0,noseWrinkle:0,leftCheek:0,rightCheek:0,jawOpen:0,jawSide:0};
let face={...defaultFace};
let history=[];
let future=[];

const controls=[
 {id:'leftEye',label:'왼쪽 눈',min:0,max:100,group:'eye'},
 {id:'rightEye',label:'오른쪽 눈',min:0,max:100,group:'eye'},
 {id:'browRaise',label:'눈썹 높이',min:-100,max:100,group:'eye'},
 {id:'browTilt',label:'눈썹 기울기',min:-100,max:100,group:'eye'},
 {id:'gazeX',label:'시선 좌우',min:-100,max:100,group:'eye'},
 {id:'gazeY',label:'시선 상하',min:-100,max:100,group:'eye'},
 {id:'smile',label:'입꼬리',min:-100,max:100,group:'mouth'},
 {id:'mouthOpen',label:'입 벌리기',min:0,max:100,group:'mouth'},
 {id:'mouthWidth',label:'입술 폭',min:-100,max:100,group:'mouth'},
 {id:'lipPucker',label:'입술 오므리기',min:0,max:100,group:'mouth'},
 {id:'upperLip',label:'윗입술 두께',min:0,max:100,group:'mouth'},
 {id:'lowerLip',label:'아랫입술 두께',min:0,max:100,group:'mouth'},
 {id:'nostrilFlare',label:'콧구멍 벌림',min:0,max:100,group:'lower'},
 {id:'noseWrinkle',label:'코 찡그림',min:0,max:100,group:'lower'},
 {id:'leftCheek',label:'왼쪽 볼',min:0,max:100,group:'lower'},
 {id:'rightCheek',label:'오른쪽 볼',min:0,max:100,group:'lower'},
 {id:'jawOpen',label:'턱 벌림',min:0,max:100,group:'lower'},
 {id:'jawSide',label:'턱 좌우',min:-100,max:100,group:'lower'}
];

const presets={
 neutral:{...defaultFace},
 happy:{...defaultFace,leftEye:78,rightEye:78,browRaise:18,browTilt:-8,smile:90,mouthOpen:20,mouthWidth:28,leftCheek:28,rightCheek:28},
 sad:{...defaultFace,leftEye:68,rightEye:68,browRaise:28,browTilt:-72,gazeY:-22,smile:-78,mouthOpen:8,jawOpen:8},
 angry:{...defaultFace,leftEye:52,rightEye:52,browRaise:-28,browTilt:86,gazeY:8,smile:-56,mouthOpen:16,nostrilFlare:72,noseWrinkle:78,jawSide:8},
 surprised:{...defaultFace,leftEye:100,rightEye:100,browRaise:92,mouthOpen:100,mouthWidth:-18,lipPucker:20,jawOpen:70},
 wink:{...defaultFace,leftEye:3,rightEye:82,browRaise:14,browTilt:-8,gazeX:18,smile:76,mouthOpen:10,mouthWidth:18,leftCheek:18,rightCheek:18}
};

function updateCurveGeometry(value,points,radius){
 const old=value.geometry;
 const curve=new THREE.CatmullRomCurve3(points.map(point=>new THREE.Vector3(...point)),false,'catmullrom',.35);
 value.geometry=new THREE.TubeGeometry(curve,32,radius,10,false);
 old.dispose();
}

function updateRig(){
 const gazeX=THREE.MathUtils.clamp(face.gazeX/100,-1,1)*.085;
 const gazeY=THREE.MathUtils.clamp(face.gazeY/100,-1,1)*.065;
 for(const [side,key,x] of [['L','leftEye',-.42],['R','rightEye',.42]]){
  const open=THREE.MathUtils.clamp(face[key]/100,0,1);
  parts['eye'+side].scale.y=.025+.155*open;
  parts['iris'+side].scale.y=.012+.103*open;
  parts['pupil'+side].scale.y=.007+.045*open;
  parts['iris'+side].position.set(x+gazeX,.28+gazeY,.985);
  parts['pupil'+side].position.set(x+gazeX,.28+gazeY,1.018);
  updateCurveGeometry(parts['upperLid'+side],[[x-.32,.28,1.075],[x-.18,.28+.115*open,1.085],[x,.28+.17*open,1.09],[x+.18,.28+.115*open,1.085],[x+.32,.28,1.075]],.026);
  updateCurveGeometry(parts['lowerLid'+side],[[x-.32,.28,1.075],[x-.18,.28-.115*open,1.085],[x,.28-.17*open,1.09],[x+.18,.28-.115*open,1.085],[x+.32,.28,1.075]],.022);
  const visible=open>.035;
  parts['eye'+side].visible=parts['iris'+side].visible=parts['pupil'+side].visible=visible;
 }
 const raise=THREE.MathUtils.clamp(face.browRaise/100,-1,1);
 const tilt=THREE.MathUtils.clamp(face.browTilt/100,-1,1);
 parts.browL.position.y=parts.browR.position.y=.63+raise*.18;
 parts.browL.rotation.z=-tilt*.42;
 parts.browR.rotation.z=tilt*.42;

 const nostril=THREE.MathUtils.clamp(face.nostrilFlare/100,0,1);
 const wrinkle=THREE.MathUtils.clamp(face.noseWrinkle/100,0,1);
 parts.nostrilL.position.x=-.078-.045*nostril;parts.nostrilR.position.x=.078+.045*nostril;
 parts.nostrilL.scale.set(.045+.035*nostril,.026+.018*nostril,.018);
 parts.nostrilR.scale.copy(parts.nostrilL.scale);
 parts.noseTip.position.y=-.035+.035*wrinkle;
 parts.noseTip.scale.y=.15-.025*wrinkle;
 parts.noseCreaseL.visible=parts.noseCreaseR.visible=wrinkle>.08;
 parts.noseCreaseL.scale.x=parts.noseCreaseR.scale.x=.12+.08*wrinkle;

 const jawOpen=THREE.MathUtils.clamp(face.jawOpen/100,0,1);
 const jawSide=THREE.MathUtils.clamp(face.jawSide/100,-1,1);
 jaw.position.set(jawSide*.16,-jawOpen*.18,0);
 jaw.rotation.z=-jawSide*.07;
 parts.jaw.scale.y=.48+.06*jawOpen;

 const smile=THREE.MathUtils.clamp(face.smile/100,-1,1);
 const open=Math.max(THREE.MathUtils.clamp(face.mouthOpen/100,0,1),jawOpen*.55);
 const pucker=THREE.MathUtils.clamp(face.lipPucker/100,0,1);
 const widthValue=THREE.MathUtils.clamp(face.mouthWidth/100,-1,1);
 const width=.42*(1+widthValue*.25)*(1-pucker*.38);
 const lipZ=1.045+pucker*.13;
 const cornerY=-.43+smile*.16;
 const upperY=-.405+smile*.015+open*.025;
 const lowerY=-.455+smile*.01-open*.14;
 const upperRadius=.018+THREE.MathUtils.clamp(face.upperLip/100,0,1)*.06;
 const lowerRadius=.02+THREE.MathUtils.clamp(face.lowerLip/100,0,1)*.065;
 updateCurveGeometry(parts.upperLip,[[-width,cornerY,lipZ],[-width*.52,upperY+.025,lipZ+.01],[0,upperY-.015,lipZ+.025],[width*.52,upperY+.025,lipZ+.01],[width,cornerY,lipZ]],upperRadius);
 updateCurveGeometry(parts.lowerLip,[[-width,cornerY,lipZ],[-width*.52,lowerY-.02,lipZ+.01],[0,lowerY-.055,lipZ+.025],[width*.52,lowerY-.02,lipZ+.01],[width,cornerY,lipZ]],lowerRadius);
 parts.mouthOpen.visible=open>.02;
 parts.mouthOpen.scale.set(width*.98,.035+.24*open,.055);
 parts.mouthOpen.position.set(0,(upperY+lowerY)/2-.02,lipZ-.08);
 parts.tongue.visible=open>.28;
 parts.tongue.scale.set(width*.62,.025+.08*open,.025);
 parts.tongue.position.set(0,lowerY-.02,lipZ-.015);
 for(const [side,key,direction] of [['L','leftCheek',-1],['R','rightCheek',1]]){
  const puff=THREE.MathUtils.clamp(face[key]/100,0,1);
  parts['puff'+side].scale.set(.01+.31*puff,.01+.3*puff,.01+.28*puff);
  parts['puff'+side].position.x=direction*(.72+.035*puff);
  parts['puff'+side].position.z=.68+.22*puff;
  parts['cheek'+side].scale.set(.24+.08*puff,.11+.07*puff,.035+.035*puff);
  parts['cheek'+side].material.opacity=Math.max(Math.max(0,smile/100)*.48,puff*.26);
  parts['cheek'+side].material.needsUpdate=true;
 }
}

const inputs=new Map();
function signedValue(id,value){
 return ['browRaise','browTilt','gazeX','gazeY','smile','mouthWidth','jawSide'].includes(id)&&value>0?'+'+value:String(value);
}
function matchingPreset(){
 const found=Object.entries(presets).find(([,preset])=>controls.every(control=>preset[control.id]===face[control.id]));
 return found?found[0]:'';
}
function refreshUI(){
 for(const control of controls){
  const input=inputs.get(control.id);
  if(input){
   input.value=face[control.id];
   $('value_'+control.id).textContent=signedValue(control.id,face[control.id]);
  }
 }
 const active=matchingPreset();
 document.querySelectorAll('[data-preset]').forEach(button=>button.classList.toggle('active',button.dataset.preset===active));
 updateRig();
}
function pushHistory(){
 history.push({...face});
 if(history.length>100)history.shift();
 future=[];
 updateHistoryButtons();
}
function updateHistoryButtons(){
 $('undo').disabled=!history.length;
 $('redo').disabled=!future.length;
}

for(const control of controls){
 const row=document.createElement('div');
 row.className='row';
 const label=document.createElement('label');
 label.textContent=control.label;
 const input=document.createElement('input');
 input.type='range';
 input.min=control.min;
 input.max=control.max;
 input.step=1;
 input.value=face[control.id];
 const value=document.createElement('span');
 value.className='value';
 value.id='value_'+control.id;
 let started=false;
 input.addEventListener('pointerdown',()=>{pushHistory();started=true});
 input.addEventListener('input',()=>{
  if(!started){pushHistory();started=true}
  face[control.id]=Number(input.value);
  refreshUI();
 });
 input.addEventListener('change',()=>{started=false});
 row.append(label,input,value);
 $(control.group==='eye'?'eyeControls':control.group==='mouth'?'mouthControls':'lowerControls').append(row);
 inputs.set(control.id,input);
}

$('presetButtons').addEventListener('click',event=>{
 const button=event.target.closest('[data-preset]');
 if(!button)return;
 const preset=presets[button.dataset.preset];
 if(!preset)return;
 pushHistory();
 face={...preset};
 refreshUI();
 status('표정 프리셋 적용: '+button.textContent.trim());
});
$('reset').addEventListener('click',()=>{
 pushHistory();
 face={...defaultFace};
 refreshUI();
 status('표정을 초기화했습니다.');
});
$('undo').addEventListener('click',()=>{
 if(!history.length)return;
 future.push({...face});
 face=history.pop();
 refreshUI();
 updateHistoryButtons();
});
$('redo').addEventListener('click',()=>{
 if(!future.length)return;
 history.push({...face});
 face=future.pop();
 refreshUI();
 updateHistoryButtons();
});

function setCamera(position){
 camera.position.set(...position);
 orbit.target.set(0,.02,0);
 orbit.update();
}
$('frontView').addEventListener('click',()=>setCamera([0,0,4.4]));
$('threeView').addEventListener('click',()=>setCamera([2.5,.4,3.6]));

function download(blob,name){
 const url=URL.createObjectURL(blob);
 const anchor=document.createElement('a');
 anchor.href=url;
 anchor.download=name;
 anchor.click();
 setTimeout(()=>URL.revokeObjectURL(url),3000);
}
$('save').addEventListener('click',()=>{
 const doc={schemaVersion:'1.0.0',projectType:'hexa-expression',name:'Hexa Expression',expression:{...face}};
 download(new Blob([JSON.stringify(doc,null,2)],{type:'application/json'}),'hexa-expression.json');
 status('표정 JSON을 저장했습니다.');
});
$('loadbtn').addEventListener('click',()=>$('load').click());
$('load').addEventListener('change',async event=>{
 const file=event.target.files[0];
 if(!file)return;
 try{
  const doc=JSON.parse(await file.text());
  if(doc.projectType!=='hexa-expression'||!doc.expression)throw Error('지원하지 않는 표정 파일');
  const loaded={...defaultFace,...doc.expression};
  for(const control of controls){
   const value=loaded[control.id];
   if(typeof value!=='number'||!Number.isFinite(value)||value<control.min||value>control.max)throw Error(control.label+' 값 오류');
  }
  pushHistory();
  face=loaded;
  refreshUI();
  status(file.name+' 불러오기 완료');
 }catch(error){
  alert('불러오기 실패: '+error.message);
  status('불러오기 실패');
 }finally{
  event.target.value='';
 }
});

$('png').addEventListener('click',()=>{
 const oldSize=new THREE.Vector2();
 renderer.getSize(oldSize);
 const oldRatio=camera.aspect;
 try{
  camera.aspect=1;
  camera.updateProjectionMatrix();
  renderer.setSize(1600,1600,false);
  renderer.render(scene,camera);
  renderer.domElement.toBlob(blob=>{
   if(blob)download(blob,'hexa-expression.png');
   else alert('PNG 출력 실패');
   renderer.setSize(oldSize.x,oldSize.y,false);
   camera.aspect=oldRatio;
   camera.updateProjectionMatrix();
  },'image/png');
 }catch(error){
  renderer.setSize(oldSize.x,oldSize.y,false);
  camera.aspect=oldRatio;
  camera.updateProjectionMatrix();
  alert(error.message);
 }
});

window.addEventListener('keydown',event=>{
 if(event.target.matches('input'))return;
 if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z'){
  event.preventDefault();
  event.shiftKey?$('redo').click():$('undo').click();
 }
 if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='y'){
  event.preventDefault();
  $('redo').click();
 }
});

function resize(){
 const width=$('view').clientWidth;
 const height=$('view').clientHeight;
 camera.aspect=width/Math.max(1,height);
 camera.updateProjectionMatrix();
 renderer.setSize(width,height,false);
}
new ResizeObserver(resize).observe($('view'));
function tick(){
 requestAnimationFrame(tick);
 orbit.update();
 renderer.render(scene,camera);
}
resize();
refreshUI();
updateHistoryButtons();
status('준비 완료 · 얼굴 전용 표정 편집기');
tick();
</script>
</body>
</html>
