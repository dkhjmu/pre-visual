<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEXA Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#141922;color:#dce5ef;font:14px system-ui,sans-serif}header,nav,aside,main{padding:16px}header{display:flex;align-items:center;gap:12px;background:#1d2530;border-bottom:1px solid #394454}h1{font-size:20px;color:#7ce1cf;margin:0 auto 0 0}button,input,select{font:inherit;color:inherit;background:#263341;border:1px solid #46586a;border-radius:6px;padding:8px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:hover:not(:disabled),button.active{background:#345e5a}nav{display:flex;gap:8px;flex-wrap:wrap}#layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 120px)}aside{border-right:1px solid #394454}main{min-width:0}h2{font-size:17px}small,.muted{color:#9aabba}#status{padding:8px 16px;color:#9dd9c7;white-space:pre-wrap}#scenes button{display:block;width:100%;text-align:left;margin:5px 0}.card{background:#202a36;padding:15px;border-radius:8px;margin:10px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}label{display:block;margin:10px 0}label input,label select{margin-left:8px}iframe{width:100%;height:75vh;border:1px solid #46586a;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#8cddce}#assets li{margin:8px 0}@media(max-width:800px){#layout{grid-template-columns:1fr}aside{border-right:0}header{flex-wrap:wrap}}
</style></head><body>
<header><h1>⬡ HEXA STUDIO <small>v0.1</small></h1><button id="open">프로젝트 폴더 열기 / 생성</button><button id="save" disabled>프로젝트 저장</button></header>
<nav id="nav"></nav><div id="status" role="status">프로젝트 전용 폴더를 선택하세요. 기존 project.json이 있으면 열고, 없으면 새 프로젝트를 생성합니다.</div>
<div id="layout"><aside><h2 id="projectName">프로젝트 없음</h2><div id="summary" class="muted"></div><h2>씬 / 컷</h2><button id="add" disabled>+ 4초 컷 추가</button><div id="scenes"></div></aside><main><section id="dashboard"></section><section id="tool" hidden><p id="toolNote"></p><iframe id="frame" title="HEXA editor"></iframe></section></main></div>
<script>
'use strict';
const $=id=>document.getElementById(id), types=['characters','locations','props','actions','cameras','lighting','styles','workflows'], stages=['PREVIS','IMAGE','MOTION','EDITOR'], tabs=['PROJECT','ASSETS','CHARACTER','EXPRESSION','PREVIS','IMAGE','MOTION','EDITOR'], urls={CHARACTER:'hexa-dance.html',EXPRESSION:'hexa-expression.html',PREVIS:'hexa-previs.html'};
let root=null, project=null, selected=null, tab='PROJECT', busy=false, dirty=false, knownText=null;
const status=s=>$('status').textContent=s;
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const btn=(text,fn)=>{const b=el('button',text);b.onclick=()=>run(fn);return b};
const uuid=()=>crypto.randomUUID();
async function run(fn){if(busy)return;busy=true;try{await fn()}catch(e){status(e.name==='AbortError'?'선택 취소':String(e.message||e))}finally{busy=false}}
async function dir(path,create=false){let d=root;for(const p of path.split('/').filter(Boolean))d=await d.getDirectoryHandle(p,{create});return d}
async function read(d,n){return await (await (await d.getFileHandle(n)).getFile()).text()}
async function write(d,n,value){const h=await d.getFileHandle(n,{create:true}), w=await h.createWritable();try{await w.write(value);await w.close()}catch(e){await w.abort().catch(()=>{});throw e}}
async function existing(d,n){try{return await read(d,n)}catch(e){if(e.name==='NotFoundError')return null;throw e}}
function valid(p){return p&&p.schemaVersion===1&&typeof p.name==='string'&&Array.isArray(p.cuts)&&p.cuts.every(c=>c&&typeof c.id==='string'&&/^C[0-9a-f-]+$/i.test(c.id)&&typeof c.name==='string'&&Number.isInteger(c.frames)&&c.frames>0&&c.frames<=120)}
async function open(){if(!window.showDirectoryPicker)throw Error('Chrome/Edge HTTPS 또는 localhost에서 실행하세요.');if(dirty&&!confirm('저장하지 않은 변경을 버릴까요?'))return;const d=await showDirectoryPicker({mode:'readwrite'});const raw=await existing(d,'project.json');let p;if(raw!==null){p=JSON.parse(raw);if(!valid(p))throw Error('지원하지 않는 project.json 형식입니다. 기존 파일은 변경하지 않았습니다.')}else{if(!confirm(d.name+' 폴더에 새 HEXA 프로젝트를 생성할까요? 전용 폴더를 권장합니다.'))return;p={schemaVersion:1,projectId:uuid(),name:d.name,fps:24,width:2560,height:1440,defaultCutFrames:96,cuts:[]};await write(d,'project.json',JSON.stringify(p,null,2)+'\n');}
root=d;project=p;knownText=raw===null?JSON.stringify(p,null,2)+'\n':raw;selected=p.cuts[0]?.id||null;dirty=false;for(const t of types)await dir('assets/'+t,true);for(const t of ['scenes','audio','jobs','exports'])await dir(t,true);status('프로젝트 열림: '+d.name);show('PROJECT')}
async function save(){if(!project)return;const current=await existing(root,'project.json');if(current!==knownText)throw Error('외부에서 project.json이 변경되었습니다. 다시 열어 충돌을 해결하세요.');const next=JSON.stringify(project,null,2)+'\n';await write(root,'project.json',next);knownText=next;dirty=false;status('프로젝트 저장 완료');render()}
function changed(){dirty=true;render()}
function cut(){return project?.cuts.find(c=>c.id===selected)}
async function add(){if(!project)return;const c={id:'C'+uuid(),name:'CUT '+String(project.cuts.length+1).padStart(3,'0'),frames:96,assets:{},action:'',camera:'',lighting:'',stage:'PREVIS'};await dir('scenes/'+c.id,true);project.cuts.push(c);selected=c.id;changed();await save()}
function field(parent,label,value,fn,type='text'){const l=el('label',label),i=el('input');i.type=type;i.value=value??'';i.onchange=()=>fn(i.value);l.append(i);parent.append(l);return i}
async function listAssets(t){const a=[];const d=await dir('assets/'+t);for await(const [name,h] of d.entries())if(h.kind==='directory'){try{const v=JSON.parse(await read(h,'asset.json'));if(typeof v.name==='string')a.push({id:name,name:v.name})}catch{}}return a.sort((a,b)=>a.name.localeCompare(b.name))}
async function importAsset(t){const name=prompt('에셋 이름');if(!name?.trim())return;const picker=el('input');picker.type='file';picker.multiple=true;const files=await new Promise(resolve=>{picker.onchange=()=>resolve([...picker.files]);picker.oncancel=()=>resolve([]);picker.click()});if(!files.length)return;const id=uuid(),d=await dir('assets/'+t+'/'+id,true);const names=[];for(const f of files){if(f.name==='asset.json'||names.includes(f.name))throw Error('예약 또는 중복 파일명: '+f.name);await write(d,f.name,f);names.push(f.name)}await write(d,'asset.json',JSON.stringify({schemaVersion:1,id,type:t,name:name.trim(),files:names},null,2)+'\n');status('에셋 등록 완료');render()}
function show(t){tab=t;for(const b of $('nav').children)b.classList.toggle('active',b.textContent===t);$('dashboard').hidden=!!urls[t];$('tool').hidden=!urls[t];if(urls[t]){if($('frame').getAttribute('src')!==urls[t])$('frame').src=urls[t];$('toolNote').textContent='기존 편집기 연결 · 현재는 파일 내보내기/가져오기로 연동합니다. 탭 이동 전 편집기 데이터를 저장하세요.'}render()}
function render(){ $('projectName').textContent=project?.name||'프로젝트 없음';$('summary').textContent=project?project.cuts.length+'컷 · '+(project.cuts.reduce((s,c)=>s+c.frames,0)/24).toFixed(2)+'초 · 24fps'+(dirty?' · 미저장':''):'';$('add').disabled=!project;$('save').disabled=!project;const list=$('scenes');list.replaceChildren();for(const c of project?.cuts||[]){const b=btn(c.name+' · '+(c.frames/24).toFixed(2)+'s',()=>{selected=c.id;show('PROJECT')});if(c.id===selected)b.classList.add('active');list.append(b)}const p=$('dashboard');p.replaceChildren();if(urls[tab])return;p.append(el('h2',tab));if(!project){p.append(el('p','먼저 프로젝트 폴더를 열어주세요.'));return}if(tab==='ASSETS'){for(const t of types){const box=el('div',undefined,'card');box.append(el('h2',t),btn('파일 에셋 등록',()=>importAsset(t)));const ul=el('ul');box.append(ul);p.append(box);listAssets(t).then(a=>{for(const x of a)ul.append(el('li',x.name));if(!a.length)ul.append(el('li','등록된 에셋 없음'))}).catch(e=>ul.append(el('li',e.message)))}return}
const c=cut();if(!c){p.append(el('p','왼쪽에서 4초 컷을 추가하세요.'));return}
if(tab!=='PROJECT'){p.append(el('p','이 단계의 실제 생성/편집 엔진은 아직 미구현입니다. 컷별 파일을 등록할 수 있습니다.'));p.append(btn('결과 파일 등록',()=>attach(c,tab)));return}
const box=el('div',undefined,'card');p.append(box);field(box,'컷 이름',c.name,v=>{c.name=v;changed()});const f=field(box,'길이 (프레임, 24fps)',c.frames,v=>{const n=Number(v);if(Number.isInteger(n)&&n>=1&&n<=120){c.frames=n;changed()}else{status('1~120 정수 프레임을 입력하세요.');render()}},'number');f.min=1;f.max=120;for(const k of ['action','camera','lighting'])field(box,k,c[k],v=>{c[k]=v;changed()});for(const t of types){const l=el('label',t),s=el('select');s.append(new Option('선택 안 함',''));l.append(s);box.append(l);listAssets(t).then(a=>{for(const x of a)s.append(new Option(x.name,x.id));s.value=c.assets?.[t]||''}).catch(e=>status(e.message));s.onchange=()=>{c.assets=c.assets||{};c.assets[t]=s.value;changed()}}
const r=el('div',undefined,'row');box.append(r);r.append(btn('PREVIS 파일 등록',()=>attach(c,'PREVIS')),btn('PREVIS 열기',()=>show('PREVIS')));for(const k of stages){const files=c.files?.[k]||[];box.append(el('p',k+': '+(files.join(', ')||'미등록'),'muted'))}}
async function attach(c,stage){const picker=el('input');picker.type='file';picker.multiple=true;const files=await new Promise(resolve=>{picker.onchange=()=>resolve([...picker.files]);picker.oncancel=()=>resolve([]);picker.click()});if(!files.length)return;const d=await dir('scenes/'+c.id+'/'+stage.toLowerCase(),true);c.files=c.files||{};c.files[stage]=c.files[stage]||[];for(const f of files){const name=uuid()+'-'+f.name;await write(d,name,f);c.files[stage].push(name)}changed();await save()}
for(const t of tabs)$('nav').append(btn(t,()=>show(t)));$('open').onclick=()=>run(open);$('save').onclick=()=>run(save);$('add').onclick=()=>run(add);window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});show('PROJECT');
</script></body></html>
