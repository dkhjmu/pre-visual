<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEXA Studio Production</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#141922;color:#dce5ef;font:14px system-ui,sans-serif}header,nav,main{padding:14px 22px}header{display:flex;align-items:center;gap:10px;background:#1d2530;flex-wrap:wrap}h1{font-size:21px;color:#7ce1cf;margin:0 auto 0 0}button,input,textarea,select{font:inherit;color:inherit;background:#263341;border:1px solid #46586a;border-radius:6px;padding:8px}button{cursor:pointer}button:hover,button.active{background:#345e5a}button:disabled{opacity:.4;cursor:default}nav,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#status{padding:8px 22px;color:#9dd9c7;white-space:pre-wrap}.card{background:#202a36;border:1px solid #344454;padding:15px;border-radius:9px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.metric{font-size:28px;color:#83d9c3;font-weight:bold}.muted,small{color:#9aabba}h2{font-size:20px}h3{font-size:16px;margin:8px 0}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px;border-bottom:1px solid #344454}th{color:#9aabba}td button{width:100%;text-align:left}.pill{font-weight:bold;font-size:12px}.ok{color:#68c9a1}.wait{color:#e1b562}.bad{color:#e47777}.none{color:#8593a3}label{display:block;margin:9px 0}label input,label select{margin-left:8px}textarea{display:block;width:100%;min-height:100px;margin:6px 0;resize:vertical}iframe{width:100%;height:78vh;border:1px solid #46586a;border-radius:8px}img,video{width:100%;aspect-ratio:16/9;object-fit:contain;background:#10151d;border-radius:6px}img{cursor:zoom-in}.approved{outline:2px solid #68c9a1}.media{min-width:0;overflow-wrap:anywhere}.bar{height:8px;background:#34404c;border-radius:6px;overflow:hidden}.bar>div{height:100%;background:#68c9a1}dialog{width:min(96vw,1500px);background:#141922;color:#fff;border:1px solid #46586a;border-radius:8px}dialog img{max-height:80vh;aspect-ratio:auto;cursor:default}dialog::backdrop{background:#000b}a{color:#7ce1cf}.spacer{flex:1}pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body>
<header><h1>⬡ HEXA STUDIO <small>v0.2</small></h1><button id="open">프로젝트 열기 / 생성</button><button id="refresh">새로고침</button><button id="add">+ 4초 컷</button></header>
<nav id="nav"></nav><div id="status" role="status">Chrome / Edge에서 전용 프로젝트 폴더를 선택하세요.</div>
<main><section id="main"></section><section id="tools" hidden><p class="muted">기존 편집기에서 JSON/PNG를 내보낸 후 Studio에 등록하세요. 자동 전달은 후속 구현입니다.</p><iframe id="frame" title="HEXA editor"></iframe></section></main>
<dialog id="zoom"><div class="row"><span id="zoomTitle"></span><span class="spacer"></span><button id="closeZoom">닫기</button></div><img id="zoomImg" alt="원본 이미지"></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id), tabs=['PRODUCTION','ASSETS','DIRECTOR','CHARACTER','EXPRESSION','PREVIS','EDITOR'], urls={CHARACTER:'hexa-dance.html',EXPRESSION:'hexa-expression.html',PREVIS:'hexa-previs.html'};
let root=null, project=null, cuts=[], tab='PRODUCTION', selected=null, filter='all', busy=false, blobs=[], generation=0;
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const status=s=>$('status').textContent=s, uid=()=>crypto.randomUUID();
const button=(text,fn)=>{const b=el('button',text);b.onclick=()=>run(fn);return b};
async function run(fn){if(busy)return;busy=true;try{await fn()}catch(e){status(e.name==='AbortError'?'선택 취소':String(e.message||e))}finally{busy=false}}
function safe(s){if(typeof s!=='string'||!s||s==='.'||s==='..'||/[\\/]/.test(s))throw Error('잘못된 파일명: '+s);return s}
async function dir(path,create=false){let d=root;for(const p of path.split('/').filter(Boolean))d=await d.getDirectoryHandle(safe(p),{create});return d}
async function file(path){const p=path.split('/'),n=safe(p.pop());return (await (await dir(p.join('/'))).getFileHandle(n)).getFile()}
async function read(path,fallback){try{return await (await file(path)).text()}catch(e){if(e.name==='NotFoundError'&&arguments.length>1)return fallback;throw e}}
async function json(path,fallback){const v=await read(path,null);if(v===null){if(arguments.length>1)return fallback;throw Error('파일 없음: '+path)}return JSON.parse(v)}
async function write(path,value){const p=path.split('/'),n=safe(p.pop()),d=await dir(p.join('/'),true),h=await d.getFileHandle(n,{create:true}),w=await h.createWritable();try{await w.write(value);await w.close()}catch(e){await w.abort().catch(()=>{});throw e}}
const put=(p,v)=>write(p,JSON.stringify(v,null,2)+'\n');
async function entries(path,kind){try{const d=await dir(path),a=[];for await(const [n,h] of d.entries())if(!kind||h.kind===kind)a.push(n);return a.sort()}catch(e){if(e.name==='NotFoundError')return [];throw e}}
async function exists(path){try{await file(path);return true}catch(e){if(e.name==='NotFoundError')return false;throw e}}
async function pick(accept,multiple=false){const i=el('input');i.type='file';i.accept=accept;i.multiple=multiple;return new Promise(resolve=>{i.onchange=()=>resolve([...i.files]);i.oncancel=()=>resolve([]);i.click()})}
const cp=c=>'cuts/'+safe(c.id), op=c=>'output/'+safe(c.id), kp=(c,k)=>cp(c)+'/keyframes/'+safe(k.id), ko=(c,k)=>op(c)+'/keyframes/'+safe(k.id);
function validId(s,p){return typeof s==='string'&&new RegExp('^'+p+'[A-Za-z0-9_-]+$').test(s)}
async function open(){if(!window.showDirectoryPicker)throw Error('Chrome/Edge HTTPS 또는 localhost에서 실행하세요.');const d=await showDirectoryPicker({mode:'readwrite'});let raw=null;try{raw=await (await (await d.getFileHandle('project.json')).getFile()).text()}catch(e){if(e.name!=='NotFoundError')throw e}let p=raw?JSON.parse(raw):null;if(p&&p.schemaVersion!==2)throw Error('v0.1 프로젝트는 자동 변환하지 않습니다. 새 전용 폴더를 선택하거나 수동 이전하세요. 기존 데이터는 변경하지 않았습니다.');if(p&&(!Array.isArray(p.cuts)||p.cuts.some(x=>!validId(x,'C'))))throw Error('잘못된 프로젝트 컷 목록');if(!p&&!confirm(d.name+' 폴더에 v0.2 프로젝트를 생성할까요?'))return;root=d;project=p||{schemaVersion:2,projectId:uid(),name:d.name,fps:24,width:2560,height:1440,defaultCutFrames:96,cuts:[]};if(!p)await put('project.json',project);for(const x of ['characters','locations','cuts','output','audio','workflows','jobs'])await dir(x,true);selected=null;await reload();show('PRODUCTION')}
async function reload(){if(!root)return;const p=await json('project.json');if(p.schemaVersion!==2||!Array.isArray(p.cuts))throw Error('프로젝트 형식 오류');const next=[];for(const id of p.cuts){if(!validId(id,'C'))throw Error('잘못된 컷 ID');const c=await json('cuts/'+id+'/cut.json');if(c.id!==id||!Array.isArray(c.keyframes)||c.keyframes.some(k=>!validId(k,'K'))||!Number.isInteger(c.frames)||c.frames<1||c.frames>120)throw Error('컷 형식 오류: '+id);c._keys=[];for(const kid of c.keyframes){const k=await json(kp(c,{id:kid})+'/keyframe.json');if(k.id!==kid)throw Error('키프레임 ID 오류');k._previs=await exists(kp(c,k)+'/previs.png');k._result=await result(ko(c,k),/\.(png|jpe?g|webp)$/i);c._keys.push(k)}c._motion=await result(op(c)+'/videos',/\.(mp4|webm)$/i);c._previs=await exists(cp(c)+'/previs.json');next.push(c)}project=p;cuts=next;status('프로젝트: '+p.name+' · 실제 파일 기준으로 갱신');await render()}
async function result(path,ext){const files=(await entries(path,'file')).filter(n=>ext.test(n));const r=await json(path+'/result.json',{});return {files,approved:files.includes(r.approved)?r.approved:null,error:typeof r.error==='string'?r.error:null,running:r.state==='running'}}
async function saveCut(c){const { _keys,_motion,_previs,...v}=c;await put(cp(c)+'/cut.json',v)}
async function add(){if(!project)throw Error('프로젝트를 먼저 여세요');const p=await json('project.json'),id='C'+uid(),c={id,name:'CUT '+String(p.cuts.length+1).padStart(3,'0'),frames:96,characters:[],location:null,keyframes:[]};await saveCut(c);await write(cp(c)+'/direction.md','');await write(cp(c)+'/motion_prompt.md','');p.cuts.push(id);await put('project.json',p);selected=id;await reload();show('DIRECTOR')}
async function addKey(c){const v=prompt('키프레임 위치 (0 ~ '+(c.frames-1)+' 프레임)',String(c._keys.length?c.frames-1:0));if(v===null)return;const f=Number(v);if(!Number.isInteger(f)||f<0||f>=c.frames||c._keys.some(k=>k.frame===f))throw Error('범위 내 중복되지 않는 정수 프레임을 입력하세요');const k={id:'K'+uid(),frame:f};await put(kp(c,k)+'/keyframe.json',k);await write(kp(c,k)+'/prompt.md','');c.keyframes.push(k.id);await saveCut(c);await reload()}
async function replaceFile(path,accept){const [f]=await pick(accept);if(!f)return;if(await exists(path)&&!confirm('기존 입력 파일을 교체할까요?'))return;if(path.endsWith('.json'))JSON.parse(await f.text());if(path.endsWith('.png')&&!f.name.toLowerCase().endsWith('.png'))throw Error('PNG 파일을 선택하세요');await write(path,f);await reload()}
async function candidates(path,accept,ext){const fs=await pick(accept,true);for(const f of fs){if(!ext.test(f.name))throw Error('지원하지 않는 파일: '+f.name);await write(path+'/candidate_'+uid()+'_'+safe(f.name),f)}await reload()}
async function approve(path,n){const r=await json(path+'/result.json',{});r.approved=safe(n);await put(path+'/result.json',r);await reload()}
function state(r){return r.approved?['확정','ok']:r.running?['실행 중','wait']:r.error?['실패','bad']:r.files.length?['검수 대기','wait']:['미작업','none']}
function badge(s){return el('span',s[0],'pill '+s[1])}
function states(c){const all=c._keys.length&&c._keys.every(k=>k._result.approved),some=c._keys.some(k=>k._result.files.length),err=c._keys.some(k=>k._result.error),running=c._keys.some(k=>k._result.running);return [[c.characters.length&&c.location?'설계 완료':'설계 중',c.characters.length&&c.location?'ok':'none'],[c._previs&&c._keys.length&&c._keys.every(k=>k._previs)?'준비 완료':'미완료',c._previs&&c._keys.length&&c._keys.every(k=>k._previs)?'ok':'none'],all?['확정','ok']:running?['실행 중','wait']:err?['실패','bad']:some?['검수 대기','wait']:['미작업','none'],state(c._motion)]}
function show(t){tab=t;for(const b of $('nav').children)b.classList.toggle('active',b.textContent===t);$('main').hidden=!!urls[t];$('tools').hidden=!urls[t];if(urls[t]){if($('frame').getAttribute('src')!==urls[t])$('frame').src=urls[t]}else render().catch(e=>status(e.message))}
function media(parent,path,name,approved,video=false){const box=el('div',undefined,'media'),node=el(video?'video':'img');if(video){node.controls=true;node.preload='metadata'}else{node.alt=name;node.loading='lazy';node.onclick=()=>{$('zoomTitle').textContent=name;$('zoomImg').src=node.src;$('zoom').showModal()}}if(approved)node.classList.add('approved');box.append(node,el('small',name));parent.append(box);const g=generation;file(path).then(f=>{if(g!==generation)return;const u=URL.createObjectURL(f);blobs.push(u);node.src=u}).catch(e=>box.append(el('p',e.message,'bad')));return box}
function textField(parent,label,value,fn){const l=el('label',label),i=el('input');i.value=value;l.append(i);parent.append(l,button('저장: '+label,()=>fn(i.value)))}
async function md(parent,label,path){const a=el('textarea');a.value=await read(path,'');parent.append(el('h3',label),a,button('저장: '+label,async()=>{await write(path,a.value);status('저장: '+path)}))}
async function assets(type){const list=[];for(const id of await entries(type,'directory')){try{const a=await json(type+'/'+id+'/asset.json');list.push({id,name:a.name||id,files:a.files||[]})}catch(e){status('에셋 읽기 실패: '+id+' '+e.message)}}return list}
async function importAsset(type){const name=prompt('에셋 이름');if(!name?.trim())return;const fs=await pick('.png,.jpg,.jpeg,.webp,.json,.md,.txt',true);if(!fs.length)return;const id=uid(),names=[];for(const f of fs){if(f.name==='asset.json'||names.includes(f.name))throw Error('예약/중복 파일명');await write(type+'/'+id+'/'+safe(f.name),f);names.push(f.name)}await put(type+'/'+id+'/asset.json',{schemaVersion:1,id,type,name:name.trim(),files:names});await render()}
async function render(){const g=++generation;for(const u of blobs)URL.revokeObjectURL(u);blobs=[];const p=$('main');p.replaceChildren();$('add').disabled=!project;$('refresh').disabled=!project;if(!project){p.append(el('h2','프로젝트 폴더를 열어주세요.'));return}if(urls[tab])return;
if(tab==='ASSETS'){for(const t of ['characters','locations']){const b=el('div',undefined,'card'),grid=el('div',undefined,'grid');b.append(el('h2',t==='characters'?'캐릭터 — 원화 + DANCE JSON':'장소 — 원화 + PREVIS 무대 JSON'),button('에셋 등록',()=>importAsset(t)),grid);p.append(b);for(const a of await assets(t)){if(g!==generation)return;const x=el('div',undefined,'card');x.append(el('h3',a.name));grid.append(x);const image=a.files.find(n=>/\.(png|jpe?g|webp)$/i.test(n));if(image)media(x,t+'/'+a.id+'/'+image,image,false);x.append(el('small',a.files.join(', ')))}}return}
if(tab==='EDITOR'){p.append(el('h2','EDITOR'),el('p','확정 영상 목록 · 실제 편집기는 후속 구현입니다.'));for(const c of cuts)if(c._motion.approved)media(p,op(c)+'/videos/'+c._motion.approved,c.name,true,true);return}
const c=cuts.find(v=>v.id===selected);
if(tab==='PRODUCTION'){p.append(el('h2',project.name));const grid=el('div',undefined,'grid'),counts=[cuts.length,cuts.filter(c=>states(c)[1][1]==='ok').length,cuts.filter(c=>states(c)[2][1]==='ok').length,cuts.filter(c=>c._motion.approved).length];for(const [i,n] of ['전체 컷','PREVIS 준비','키이미지 확정','영상 확정'].entries()){const b=el('div',undefined,'card');b.append(el('small',n),el('div',String(counts[i]),'metric'));grid.append(b)}p.append(grid);const pct=cuts.length?Math.round(counts[3]/cuts.length*100):0,bar=el('div',undefined,'bar'),fill=el('div');fill.style.width=pct+'%';bar.append(fill);p.append(el('p','영상 확정률 '+pct+'%'),bar);const r=el('div',undefined,'row');for(const [v,n] of [['all','전체'],['review','검수 대기'],['failed','실패']]){const b=button(n,()=>{filter=v;return render()});if(filter===v)b.classList.add('active');r.append(b)}p.append(r);const table=el('table'),head=el('tr');for(const n of ['컷','설계','PREVIS','IMAGE','MOTION'])head.append(el('th',n));table.append(head);for(const c of cuts){const st=states(c);if(filter==='review'&&!st.some(s=>s[0]==='검수 대기'))continue;if(filter==='failed'&&!st.some(s=>s[0]==='실패'))continue;const tr=el('tr'),td=el('td');td.append(button(c.name+' · '+(c.frames/24).toFixed(2)+'s',()=>{selected=c.id;return render()}));tr.append(td);for(const s of st){const cell=el('td');cell.append(badge(s));tr.append(cell)}table.append(tr)}p.append(table)}
if(!c){p.append(el('p','컷을 선택하거나 새 컷을 추가하세요.'));return}const detail=el('div',undefined,'card');p.append(detail);const row=el('div',undefined,'row'),sel=el('select');for(const x of cuts)sel.append(new Option(x.name,x.id));sel.value=c.id;sel.onchange=()=>run(async()=>{selected=sel.value;await render()});row.append(sel,el('span',c.frames+'f / '+(c.frames/24).toFixed(2)+'s'),button('연출 편집',()=>show('DIRECTOR')),button('PREVIS 열기',()=>show('PREVIS')));detail.append(row);
if(tab==='DIRECTOR'){textField(detail,'컷 이름',c.name,async v=>{c.name=v;await saveCut(c);await reload()});textField(detail,'길이 (프레임)',String(c.frames),async v=>{const n=Number(v);if(!Number.isInteger(n)||n<1||n>120||c._keys.some(k=>k.frame>=n))throw Error('길이 범위 또는 키프레임 위치 오류');c.frames=n;await saveCut(c);await reload()});const chars=await assets('characters'),locs=await assets('locations');if(g!==generation)return;const cs=el('select');cs.multiple=true;for(const a of chars){const o=new Option(a.name,'characters/'+a.id);o.selected=c.characters.includes(o.value);cs.append(o)}const ls=el('select');ls.append(new Option('장소 선택',''));for(const a of locs)ls.append(new Option(a.name,'locations/'+a.id));ls.value=c.location||'';detail.append(el('h3','캐스팅 (복수 선택)'),cs,el('h3','장소'),ls,button('캐스팅 저장',async()=>{c.characters=[...cs.selectedOptions].map(o=>o.value);c.location=ls.value||null;await saveCut(c);await reload()}),button('PREVIS JSON 등록 / 교체',()=>replaceFile(cp(c)+'/previs.json','.json')));await md(detail,'연출 지시',cp(c)+'/direction.md');await md(detail,'영상 프롬프트',cp(c)+'/motion_prompt.md')}
detail.append(el('h2','KEYFRAMES'),button('+ 키프레임 추가',()=>addKey(c)));for(const k of [...c._keys].sort((a,b)=>a.frame-b.frame)){const b=el('div',undefined,'card'),r=el('div',undefined,'row'),grid=el('div',undefined,'grid');r.append(el('h3','K · '+k.frame+'f / '+(k.frame/24).toFixed(3)+'s'),badge(state(k._result)),button('PREVIS PNG 등록',()=>replaceFile(kp(c,k)+'/previs.png','.png')),button('이미지 후보 등록',()=>candidates(ko(c,k),'.png,.jpg,.jpeg,.webp',/\.(png|jpe?g|webp)$/i)));b.append(r,grid);detail.append(b);if(k._previs)media(grid,kp(c,k)+'/previs.png','PREVIS',false);else grid.append(el('p','PREVIS 미등록','muted'));for(const n of k._result.files){const x=media(grid,ko(c,k)+'/'+n,n===k._result.approved?'확정 · '+n:n,n===k._result.approved);x.append(button(n===k._result.approved?'확정됨':'이 이미지 확정',()=>approve(ko(c,k),n)))}if(k._result.error)b.append(el('pre',k._result.error,'bad'));if(tab==='DIRECTOR')await md(b,'이미지 프롬프트',kp(c,k)+'/prompt.md')}
const v=el('div',undefined,'card'),vg=el('div',undefined,'grid');v.append(el('h2','MOTION'),badge(state(c._motion)),button('영상 후보 등록',()=>candidates(op(c)+'/videos','.mp4,.webm',/\.(mp4|webm)$/i)),vg);detail.append(v);for(const n of c._motion.files){const x=media(vg,op(c)+'/videos/'+n,n,n===c._motion.approved,true);x.append(button(n===c._motion.approved?'확정됨':'이 영상 확정',()=>approve(op(c)+'/videos',n)))}if(c._motion.error)v.append(el('pre',c._motion.error,'bad'))}
for(const t of tabs)$('nav').append(button(t,()=>show(t)));$('open').onclick=()=>run(open);$('refresh').onclick=()=>run(reload);$('add').onclick=()=>run(add);$('closeZoom').onclick=()=>$('zoom').close();show('PRODUCTION');
</script></body></html>
